# Copy to profile.yaml (gitignored) and fill in.
# Every field is optional — omit what doesn't apply. More detail = more matches.

employment:
  status: employed          # employed | self_employed | retired | student | unemployed
  employer: ""              # e.g. "Acme Corp"
  employer_slug: ""         # lowercase, for portal probing. e.g. "acme"
  work_email_domain: ""     # e.g. "acme.com" — unlocks the electronics EPPs
  perk_platform: ""         # if known: perksatwork | perkspot | benefithub | lifemart |
                            # working_advantage | abenity | fond | "" if unknown

# The highest-leverage field in retail. One verified profession unlocks dozens
# of brands at once. Be generous — eligibility is usually wider than the label
# suggests (part-time instructors, nonprofit staff, school employees of any
# kind, volunteer first responders).
profession: none            # none | military | first_responder | healthcare | teacher |
                            # student | outdoor_industry | design_trade | fitness_instructor

education:
  - institution: ""
    status: alumni          # alumni | current_student

memberships: []             # costco, sams_club, aaa, credit_union

verified_identities: []     # which you've already done: idme, sheerid, unidays, govx

location:
  country: US
  state: ""

# Used only to order the report.
interests:
  - electronics
  - apparel
  - home
