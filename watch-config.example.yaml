# Copy to watch-config.yaml (gitignored - it holds API keys).

database: prices.db

# Where alerts go. console | macos | ntfy | telegram
notify: [console, telegram]

rules:
  min_observations: 20      # statistical rules stay off below this
  pct_below_median: 20      # alert at 20% under the trailing median
  cooldown_hours: 12        # re-alerts only if the price drops further

# --- credentials -----------------------------------------------------------
# Best Buy: free key, developer.bestbuy.com
bestbuy_api_key: ""

# Telegram: create a bot with @BotFather, then send it a message and read your
# chat id from https://api.telegram.org/bot<TOKEN>/getUpdates
telegram_token: ""
telegram_chat_id: ""

# ntfy: any unguessable string. Subscribe to it in the ntfy phone app.
# Anyone who knows the topic can read your alerts, so don't use your name.
ntfy_topic: ""
ntfy_server: "https://ntfy.sh"

# Target: public web key, copied from a redsky request in browser devtools.
# Rotates periodically; expect to re-grab it.
target_api_key: ""
target_store_id: "1771"

# Keepa: paid. The only realistic path to Amazon, and it backfills price
# history so cold start is solved for Amazon items on day one.
keepa_api_key: ""

# Resale fee rates, used to project margin when you don't supply actual fees.
fee_rates:
  ebay: 0.1325
  amazon: 0.15
  mercari: 0.10
  local: 0.0
