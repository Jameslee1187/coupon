# APPAREL — almost entirely IDENTITY-gated, not employer-gated.
# Nearly all of these route through SheerID, ID.me, or UNiDAYS. Verifying once
# with each provider unlocks many brands, so treat the three verifications as
# the real task and the individual brands as downstream of it.

- id: nike-verified
  brand: Nike
  category: apparel
  benefit: "Percentage off for military, first responders, medical staff, students, teachers"
  eligibility: {profession_in: [military, first_responder, healthcare, teacher, student]}
  redemption:
    type: identity_verification
    url: https://www.nike.com/help/a/military-discount
    method: "SheerID verification, then a code issued to your account"
  verification: identity_provider
  confidence: high
  status: unverified
  last_verified: null
  notes: "Excluded from sale items and limited-release product, which removes most of the reason you'd want it. Check exclusions before counting on it."

