# Adjacent eligibility you probably also have. Kept separate from the employer
# wedge so the POC can show whether non-employer affiliations pull their weight.

- id: alumni-association-benefits
  brand: "Your university's alumni association"
  category: misc
  benefit: "Insurance discounts, car rental codes, software, sometimes library/journal access"
  eligibility: {has_education: true}
  redemption:
    type: portal_signup
    url: null
    method: "Search '<university> alumni association benefits'. Usually free to join, rarely advertised."
  verification: alumni_records
  confidence: high
  status: unverified
  last_verified: null
  notes: "Consistently the most underused category. Costs nothing and most alumni never look."

- id: credit-union-perks
  brand: "Your credit union"
  category: misc
  benefit: "Member discount networks (often Abenity/Love My Credit Union), rate discounts"
  eligibility: {memberships_include: credit_union}
  redemption:
    type: portal_signup
    url: https://lovemycreditunion.org/
    method: "Member login on your CU's site"
  verification: membership
  confidence: medium
  status: unverified
  last_verified: null

- id: costco-member-services
  brand: Costco
  category: misc
  benefit: "Member services beyond the warehouse: travel, auto program, insurance"
  eligibility: {memberships_include: costco}
  redemption:
    type: portal_signup
    url: https://www.costcotravel.com/
    method: "Member login"
  verification: membership
  confidence: high
  status: unverified
  last_verified: null
  notes: "The auto program and travel side are where the real money is, not the aisles."

- id: military-verified-offers
  brand: "Broad — most major retailers"
  category: misc
  benefit: "Military/veteran discounts, typically 10-20%, verified via SheerID or ID.me"
  eligibility: {military_status_in: [active, veteran, reserve, military_family]}
  redemption:
    type: identity_verification
    url: https://www.id.me/
    method: "One ID.me or SheerID verification unlocks many merchants"
  verification: identity_provider
  confidence: high
  status: unverified
  last_verified: null
  notes: "Verify once, reuse everywhere. Highest effort-to-payoff ratio of anything in this repo."
