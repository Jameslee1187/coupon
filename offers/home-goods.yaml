# HOME GOODS — split between identity-gated retail discounts and TRADE programs.
# Trade programs are the underused half: they're aimed at designers and
# contractors, the discounts are deep, and eligibility is often looser than the
# name suggests.

- id: home-depot-military
  brand: Home Depot
  category: home
  benefit: Military discount on eligible purchases, with an annual cap
  eligibility:
    profession_in:
    - military
  redemption:
    type: identity_verification
    url: https://www.homedepot.com/c/Military_Discount
    method: Enroll once; discount attaches to your account at checkout
  verification: identity_provider
  confidence: high
  status: unverified
  last_verified: null
  typical_discount_estimate:
    min_pct: 10
    max_pct: 10
  stacks: true
  friction: once
  exclusions: Annual dollar cap; excludes some brands/appliances
  layer: merchant
- id: lowes-military
  brand: Lowe's
  category: home
  benefit: Military discount on eligible purchases
  eligibility:
    profession_in:
    - military
  redemption:
    type: identity_verification
    url: https://www.lowes.com/l/military-discount.html
    method: MyLowe's account enrollment with verification
  verification: identity_provider
  confidence: high
  status: unverified
  last_verified: null
  typical_discount_estimate:
    min_pct: 10
    max_pct: 10
  stacks: true
  friction: once
  exclusions: Excludes some major appliance brands
  layer: merchant
- id: wayfair-professional
  brand: Wayfair
  category: home
  benefit: Wayfair Professional — trade pricing, free membership
  eligibility:
    profession_in:
    - design_trade
  redemption:
    type: application
    url: https://www.wayfair.com/professional
    method: Free signup; business/trade affiliation asked for but lightly checked
  verification: self_declared
  confidence: medium
  status: unverified
  last_verified: null
  notes: Eligibility is broader than 'interior designer' — contractors, property managers,
    and small-business buyers qualify. Verify what they actually require before assuming you
    don't.
  typical_discount_estimate:
    min_pct: 5
    max_pct: 15
  stacks: false
  friction: once
  exclusions: Volume-tiered; base tier is shallow
  layer: merchant
- id: williams-sonoma-trade
  brand: Williams-Sonoma / Pottery Barn / West Elm
  category: home
  benefit: Trade program discount across the brand family
  eligibility:
    profession_in:
    - design_trade
  redemption:
    type: application
    url: https://www.wsgifts.com/trade
    method: Trade application with business documentation
  verification: manual_review
  confidence: medium
  status: unverified
  last_verified: null
  notes: One application covers several brands — better effort-to-coverage ratio than applying
    per-brand.
  typical_discount_estimate:
    min_pct: 20
    max_pct: 25
  stacks: false
  friction: application
  exclusions: Excludes sale; one app covers several brands
  layer: merchant
- id: crate-barrel-trade
  brand: Crate & Barrel / CB2
  category: home
  benefit: Trade program discount
  eligibility:
    profession_in:
    - design_trade
  redemption:
    type: application
    url: https://www.crateandbarrel.com/trade/
    method: Trade application
  verification: manual_review
  confidence: medium
  status: unverified
  last_verified: null
  typical_discount_estimate:
    min_pct: 15
