- id: ikea-family
  brand: IKEA
  category: home
  benefit: IKEA Family — free membership with member pricing; separate business program
  eligibility: {}
  redemption:
    type: portal_signup
    url: https://www.ikea.com/us/en/ikea-family/
    method: Free signup, no verification
  verification: none
  confidence: high
  status: unverified
  last_verified: null
  notes: Not eligibility-gated at all, so arguably out of scope — included because it's free,
    takes a minute, and is the baseline any IKEA purchase should clear.
  typical_discount_estimate:
    min_pct: 0
    max_pct: 10
  stacks: false
  friction: none
  exclusions: Member pricing on selected items only
  layer: merchant
- id: mattress-brands-verified
  brand: Casper / Purple / Saatva / Helix
  category: home
  benefit: Military, first responder, teacher, nurse discounts
  eligibility:
    profession_in:
    - military
    - first_responder
    - healthcare
    - teacher
  redemption:
    type: identity_verification
    url: null
    method: SheerID or ID.me at checkout
  verification: identity_provider
  confidence: medium
  status: unverified
  last_verified: null
  notes: Direct-to-consumer mattress brands discount aggressively and stack verification discounts
    on top of sales more often than apparel does. Worth checking at purchase time.
  typical_discount_estimate:
    min_pct: 10
    max_pct: 30
  stacks: true
  friction: per_purchase
  exclusions: Stacks with sales more often than apparel does
  layer: merchant
- id: samsung-appliances-epp
  brand: Samsung Home Appliances
  category: home
  benefit: EPP covers appliances, not just electronics
  eligibility:
    employment_status: employed
  redemption:
    type: portal_signup
    url: https://www.samsung.com/us/shop/employee-program/
    method: Same work-email EPP registration as electronics
  verification: work_email_domain
  confidence: medium
  status: unverified
  last_verified: null
  notes: Same registration as the electronics entry — one signup, two categories. Appliance
    margins are bigger, so the absolute savings can be larger here.
  typical_discount_estimate:
    min_pct: 10
    max_pct: 30
  stacks: true
  friction: once
  exclusions: Same registration as the electronics entry
  layer: merchant
- id: dyson-refurb-corporate
  brand: Dyson
  category: home
  benefit: Corporate pricing via perk platforms; refurbished store open to everyone
  eligibility: {}
  redemption:
    type: platform_catalog
    url: https://www.dyson.com/outlet
    method: Check your perk platform; otherwise the outlet/refurb store
  verification: employer_enrollment
  confidence: medium
  status: unverified
  last_verified: null
  notes: The refurbished outlet usually beats any corporate discount, and needs no eligibility
    at all. Check it first.
  typical_discount_estimate:
    min_pct: 10
    max_pct: 30
  stacks: false
  friction: per_purchase
  exclusions: Refurb outlet usually beats the corporate rate
  layer: merchant
