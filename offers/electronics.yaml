- id: apple-epp
  brand: Apple
  category: electronics
  benefit: Employee Purchase Plan pricing — only if your employer is enrolled
  eligibility:
    employment_status: employed
  redemption:
    type: employer_enrollment
    url: https://www.apple.com/shop/browse/home/eppstore
    method: Requires an employer-specific EPP store link, usually posted on the HR intranet
  verification: employer_enrollment
  confidence: medium
  status: unverified
  last_verified: null
  notes: Unlike Dell/Samsung, there's no generic work-email path — your employer is enrolled
    or it isn't. The education store is open to more people and sometimes prices better.
  typical_discount_estimate:
    min_pct: 3
    max_pct: 10
  stacks: false
  friction: once
  exclusions: Apple discounts shallowly; rarely stacks
  layer: merchant
- id: apple-education
  brand: Apple
  category: electronics
  benefit: Education pricing on Macs and iPads; periodic gift-card promos
  eligibility:
    is_student: true
  redemption:
    type: identity_verification
    url: https://www.apple.com/us-edu/store
    method: UNiDAYS verification
  verification: identity_provider
  confidence: high
  status: unverified
  last_verified: null
  notes: Also open to teachers and staff at any level of school, not just university students
    — an eligibility edge many people miss.
  typical_discount_estimate:
    min_pct: 5
    max_pct: 10
  stacks: false
  friction: once
  exclusions: Often paired with gift-card promos worth more than the % itself
  layer: merchant
