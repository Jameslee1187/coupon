# ELECTRONICS — the one retail category where employer EPPs are still strong.
# Most of these verify a work email domain and work for nearly any employer.

- id: dell-mpp
  brand: Dell
  category: electronics
  benefit: Member Purchase Program pricing on consumer PCs, monitors, accessories; often stacks
    with site sales
  eligibility:
    employment_status: employed
  redemption:
    type: portal_signup
    url: https://www.dell.com/en-us/shop/dell-member-purchase-program/cp/mpp
    method: Register with work email; discount attaches to your account
  verification: work_email_domain
  confidence: high
  status: unverified
  last_verified: null
  notes: Monitors are usually the best value here; laptop 'discounts' often just match public
    sale pricing. Compare against the plain retail page before believing the member price.
  typical_discount_estimate:
    min_pct: 5
    max_pct: 10
  stacks: true
  friction: once
  exclusions: Often merely matches the public sale price
  layer: merchant
- id: samsung-epp
  brand: Samsung
  category: electronics
  benefit: Employee Purchase Program on phones, TVs, monitors, appliances
  eligibility:
    employment_status: employed
  redemption:
    type: portal_signup
    url: https://www.samsung.com/us/shop/employee-program/
    method: Verify work email; some employers pre-enrolled, others accept any verified domain
  verification: work_email_domain
  confidence: high
  status: unverified
  last_verified: null
  notes: Historically one of the deepest EPPs in electronics, and it covers home appliances
    too — overlaps your home-goods interest.
  typical_discount_estimate:
    min_pct: 10
    max_pct: 30
  stacks: true
  friction: once
  exclusions: Deepest on appliances; phone discounts thinner
  layer: merchant
