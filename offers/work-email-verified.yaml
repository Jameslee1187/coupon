# Dataset 3: offers gated on PROOF OF EMPLOYMENT, not on a specific employer.
# These are the cold-start engine — they work for almost any employer with a
# real email domain, whether or not your company has a perks platform.
#
# confidence = how sure we are the program still exists in this form.
#   high   = long-running, widely documented
#   medium = exists but terms/eligibility shift often
#   low    = may have changed or ended; verify before relying on it
# status: unverified means NOBODY HAS CHECKED THIS YET. Run it, then update.

- id: dell-mpp
  brand: Dell
  category: electronics
  benefit: "Member/employee purchase program pricing on consumer PCs and monitors; often stacks with site sales"
  eligibility: {employment_status: employed}
  redemption:
    type: portal_signup
    url: https://www.dell.com/en-us/shop/dell-member-purchase-program/cp/mpp
    method: "Register with work email; discount applies to your account"
  verification: work_email_domain
  confidence: high
  status: unverified
  last_verified: null

